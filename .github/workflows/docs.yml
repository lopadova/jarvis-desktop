name: Docs

# Builds the docmd site in docs-site/ on every PR that touches it, and deploys it to
# Cloudflare Pages on pushes to main.
#
# Required repository secrets (Settings › Secrets and variables › Actions):
#   CLOUDFLARE_API_TOKEN   least-privilege API token: Account › Cloudflare Pages › Edit, limited to
#                          this one account (and, where the dashboard allows, this one Pages project).
#                          Never reuse a global API key or a token with Workers/DNS permissions.
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Optional repository variable:
#   CLOUDFLARE_PAGES_PROJECT  Pages project name (default: jarvis-desktop)
# Create the Pages project once with:
#   npx wrangler pages project create jarvis-desktop --production-branch main

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the docmd git plugin reads history for "last updated"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs-site/.node-version
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install (must match package-lock.json)
        run: npm ci

      - name: Check for raw HTML in Markdown
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify no docmd container markers leaked into HTML
        run: npm run check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs-site/_site
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: docs
      url: https://jarvis-desktop.pages.dev
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: _site

      # Without the Cloudflare secrets (forks, a fresh clone) the deploy is skipped instead of failing the run.
      - name: Check deploy secrets
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'jarvis-desktop' }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
