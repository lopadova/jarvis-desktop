name: Docs

# Builds the docmd site in docs-site/ on every push to main and on every PR that touches it, to make sure the
# documentation still builds. It does NOT publish anywhere: no deploy job, no environment, no hosting credentials.
# To host the site, deploy the generated docs-site/_site folder to a static host you own (see docs/contributing/dev-setup.md).

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the docmd git plugin reads history for "last updated"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs-site/.node-version
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install (must match package-lock.json)
        run: npm ci

      - name: Check for raw HTML in Markdown
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify no docmd container markers leaked into HTML
        run: npm run check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs-site/_site
          if-no-files-found: error
          retention-days: 7
