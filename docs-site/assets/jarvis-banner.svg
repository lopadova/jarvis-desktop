<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis</title>
  <desc id="desc">The Jarvis orb glowing on a midnight background next to the Jarvis wordmark and the tagline: calm by default, alive when spoken to.</desc>
  <!-- README banner / social preview from the Claude Design handoff (Brand › Banner, 1280×640, dark). -->
  <defs>
    <radialGradient id="haze" gradientUnits="userSpaceOnUse" cx="256" cy="192" r="640" gradientTransform="translate(256 192) scale(1 0.8) translate(-256 -192)">
      <stop offset="0" stop-color="#00555b" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#00555b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="1152" cy="576" r="560">
      <stop offset="0" stop-color="#733119" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#733119" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00bfc9" stop-opacity="0.55"/>
      <stop offset="0.65" stop-color="#00bfc9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#96e8ec"/>
      <stop offset="0.6" stop-color="#00c8d1"/>
      <stop offset="1" stop-color="#004047"/>
    </radialGradient>
    <radialGradient id="hi" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b0e15"/>
  <rect width="1280" height="640" fill="url(#haze)"/>
  <rect width="1280" height="640" fill="url(#ember)"/>
  <circle cx="216" cy="320" r="204" fill="url(#glow)" opacity="0.75"/>
  <circle cx="216" cy="320" r="120" fill="url(#core)"/>
  <ellipse cx="180" cy="261" rx="41" ry="29" fill="url(#hi)" opacity="0.9"/>
  <text x="408" y="330" fill="#eef1f6" font-family="Inter, 'Inter Variable', system-ui, sans-serif" font-size="104" font-weight="650" letter-spacing="-4">Jarvis</text>
  <text x="410" y="392" fill="#eef1f6" fill-opacity="0.75" font-family="Inter, 'Inter Variable', system-ui, sans-serif" font-size="34">Calm by default. Alive when spoken to.</text>
  <!-- What it connects: pills (text only, no logos) -->
  <g font-family="Inter, 'Inter Variable', system-ui, sans-serif" font-size="22" font-weight="500" fill="#eef1f6">
    <g transform="translate(410 440)">
      <rect width="196" height="44" rx="22" fill="#10a37f" fill-opacity="0.22" stroke="#10a37f" stroke-opacity="0.7"/>
      <text x="98" y="29" text-anchor="middle">ChatGPT plan</text>
    </g>
    <g transform="translate(622 440)">
      <rect width="168" height="44" rx="22" fill="#d97757" fill-opacity="0.22" stroke="#d97757" stroke-opacity="0.7"/>
      <text x="84" y="29" text-anchor="middle">Claude Code</text>
    </g>
    <g transform="translate(806 440)">
      <rect width="120" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.45"/>
      <text x="60" y="29" text-anchor="middle">Codex</text>
    </g>
    <g transform="translate(942 440)">
      <rect width="168" height="44" rx="22" fill="#f5a524" fill-opacity="0.2" stroke="#f5a524" stroke-opacity="0.7"/>
      <text x="84" y="29" text-anchor="middle">ElevenLabs</text>
    </g>
    <g transform="translate(410 500)">
      <rect width="196" height="44" rx="22" fill="#00c8d1" fill-opacity="0.16" stroke="#00c8d1" stroke-opacity="0.65"/>
      <text x="98" y="29" text-anchor="middle">Claude Cowork</text>
    </g>
    <g transform="translate(622 500)">
      <rect width="168" height="44" rx="22" fill="#00c8d1" fill-opacity="0.16" stroke="#00c8d1" stroke-opacity="0.65"/>
      <text x="84" y="29" text-anchor="middle">via ChatGPT</text>
    </g>
    <g transform="translate(806 500)">
      <rect width="304" height="44" rx="22" fill="#34c77b" fill-opacity="0.18" stroke="#34c77b" stroke-opacity="0.7"/>
      <text x="152" y="29" text-anchor="middle">100% local mode</text>
    </g>
  </g>
</svg>
