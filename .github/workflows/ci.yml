name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript (lint · typecheck · test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and security tests (Vitest)
        run: pnpm test

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the Tauri crate
        id: crate
        run: |
          if [ -f apps/desktop/src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/desktop/src-tauri not found yet; skipping Rust checks."
          fi

      - name: Install Linux system dependencies
        if: steps.crate.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config cmake clang libclang-dev \
            libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: steps.crate.outputs.present == 'true'
        with:
          toolchain: stable # required when the action is pinned by SHA
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.crate.outputs.present == 'true'
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.crate.outputs.present == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.crate.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.crate.outputs.present == 'true'
        with:
          bun-version: latest

      - name: Install JS dependencies
        if: steps.crate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # tauri-build verifies that the frontend dist and every externalBin exist at compile time,
      # so build the UI and a sidecar for the host triple before running cargo.
      - name: Build the UI
        if: steps.crate.outputs.present == 'true'
        run: pnpm --filter @jarvis/desktop build

      - name: Build the sidecar for the host triple
        if: steps.crate.outputs.present == 'true'
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          case "$TRIPLE" in
            aarch64-apple-darwin)      BUN_TARGET=bun-darwin-arm64 ;;
            x86_64-apple-darwin)       BUN_TARGET=bun-darwin-x64 ;;
            x86_64-pc-windows-msvc)    BUN_TARGET=bun-windows-x64 ;;
            x86_64-unknown-linux-gnu)  BUN_TARGET=bun-linux-x64 ;;
            aarch64-unknown-linux-gnu) BUN_TARGET=bun-linux-arm64 ;;
            *) echo "Unsupported host triple $TRIPLE"; exit 1 ;;
          esac
          JARVIS_SIDECAR_TARGET="$TRIPLE" BUN_TARGET="$BUN_TARGET" pnpm sidecar:build

      - name: cargo fmt
        if: steps.crate.outputs.present == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: steps.crate.outputs.present == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        if: steps.crate.outputs.present == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
