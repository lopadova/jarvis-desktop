packages:
  - "apps/*"
  - "packages/*"

# pnpm ≥ 11 reads `allowBuilds` (the old `onlyBuiltDependencies` list is ignored).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
  sharp: true

# Newest SDK releases are younger than pnpm's minimum release age; allow them explicitly.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.288'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.288'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.288'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.288'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.288'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.288'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.288'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.288'
  - '@anthropic-ai/claude-agent-sdk@0.3.288'
  - '@modelcontextprotocol/sdk@1.32.0'
