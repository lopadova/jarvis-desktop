<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1280 640"><title id="title">Jarvis</title><desc id="desc">The Jarvis orb glowing on a midnight background next to the Jarvis wordmark and the tagline: calm by default, alive when spoken to.</desc><defs><radialGradient id="haze" cx="256" cy="192" r="640" gradientTransform="translate(256 192) scale(1 0.8) translate(-256 -192)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00555b" stop-opacity=".7"/><stop offset=".7" stop-color="#00555b" stop-opacity="0"/></radialGradient><radialGradient id="ember" cx="1152" cy="576" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#733119" stop-opacity=".5"/><stop offset=".7" stop-color="#733119" stop-opacity="0"/></radialGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00bfc9" stop-opacity=".55"/><stop offset=".65" stop-color="#00bfc9" stop-opacity="0"/></radialGradient><radialGradient id="core" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#96e8ec"/><stop offset=".6" stop-color="#00c8d1"/><stop offset="1" stop-color="#004047"/></radialGradient><radialGradient id="hi" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="640" fill="#0b0e15"/><rect width="1280" height="640" fill="url(#haze)"/><rect width="1280" height="640" fill="url(#ember)"/><circle cx="216" cy="320" r="204" fill="url(#glow)" opacity=".75"/><circle cx="216" cy="320" r="120" fill="url(#core)"/><ellipse cx="180" cy="261" fill="url(#hi)" opacity=".9" rx="41" ry="29"/><text x="408" y="330" fill="#eef1f6" font-family="Inter, 'Inter Variable', system-ui, sans-serif" font-size="104" font-weight="650" letter-spacing="-4">Jarvis</text><text x="410" y="392" fill="#eef1f6" fill-opacity=".75" font-family="Inter, 'Inter Variable', system-ui, sans-serif" font-size="34">Calm by default. Alive when spoken to.</text></svg>