version: 2
updates:
  # GitHub Actions are pinned by commit SHA; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # pnpm workspace (root lockfile covers apps/* and packages/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # packages/relay runs tests in workerd via @cloudflare/vitest-pool-workers, which needs vitest 4.x.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # Types track the oldest supported Node major (engines: node >= 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Documentation site (npm, separate lockfile used by `npm ci`)
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ["*"]
    commit-message:
      prefix: "docs(deps)"

  # Rust shell (Tauri)
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    ignore:
      # cpal must match the version rodio depends on, so a single cpal is linked.
      - dependency-name: "cpal"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
